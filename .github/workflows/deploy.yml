name: CI/CD — Build, Test & Deploy to AWS ECS

on:
  push:
    branches: [main]
    paths:
      - 'backend/nodejs/**'
      - 'nginx/**'
      - '.github/workflows/deploy.yml'
  pull_request:
    branches: [main]
    paths:
      - 'backend/nodejs/**'

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  AWS_REGION:       me-south-1
  ECR_REPOSITORY:   qcart-api
  ECS_CLUSTER:      qcart-production
  ECS_SERVICE:      qcart-api
  CONTAINER_NAME:   qcart-api
  TASK_FAMILY:      qcart-api

# ── Job 1: Lint + Test ─────────────────────────────────────────────────────
jobs:
  test:
    name: Lint & Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB:       qcart_test
          POSTGRES_USER:     qcart
          POSTGRES_PASSWORD: testpassword
        options: >-
          --health-cmd "pg_isready -U qcart"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    defaults:
      run:
        working-directory: backend/nodejs

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: backend/nodejs/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Run tests
        run: npm test -- --forceExit
        env:
          NODE_ENV:           test
          DATABASE_URL:       postgresql://qcart:testpassword@localhost:5432/qcart_test
          JWT_ACCESS_SECRET:  test_access_secret_at_least_32_chars_long
          JWT_REFRESH_SECRET: test_refresh_secret_at_least_32_chars_long
          JWT_ACCESS_EXPIRY:  15m
          JWT_REFRESH_EXPIRY: 7d
          BCRYPT_ROUNDS:      4
          CORS_ORIGINS:       http://localhost

# ── Job 2: Build & Push image to ECR ──────────────────────────────────────
  build:
    name: Build & Push to ECR
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    outputs:
      image: ${{ steps.push.outputs.image }}

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        id: push
        uses: docker/build-push-action@v5
        with:
          context:     backend/nodejs
          file:        backend/nodejs/Dockerfile
          push:        true
          tags: |
            ${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
            ${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest
          cache-from: type=gha
          cache-to:   type=gha,mode=max
          build-args: |
            BUILD_SHA=${{ github.sha }}

      - name: Export image URI
        run: |
          echo "image=${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}" \
            >> $GITHUB_OUTPUT
        id: export-image

# ── Job 3: Deploy to ECS ───────────────────────────────────────────────────
  deploy:
    name: Deploy to ECS Fargate
    runs-on: ubuntu-latest
    needs: build
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ env.AWS_REGION }}

      - name: Download current ECS task definition
        run: |
          aws ecs describe-task-definition \
            --task-definition ${{ env.TASK_FAMILY }} \
            --query taskDefinition \
            > task-definition.json

      - name: Inject new image into task definition
        id: render-task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition:  task-definition.json
          container-name:   ${{ env.CONTAINER_NAME }}
          image:            ${{ needs.build.outputs.image }}

      - name: Register & deploy task definition
        uses: aws-actions/amazon-ecs-deploy-task-definition@v1
        with:
          task-definition:         ${{ steps.render-task-def.outputs.task-definition }}
          service:                 ${{ env.ECS_SERVICE }}
          cluster:                 ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true
          wait-for-minutes:        10

      - name: Verify running task
        run: |
          TASK_ARN=$(aws ecs list-tasks \
            --cluster ${{ env.ECS_CLUSTER }} \
            --service-name ${{ env.ECS_SERVICE }} \
            --desired-status RUNNING \
            --query 'taskArns[0]' \
            --output text)
          echo "Task ARN: $TASK_ARN"
          STATUS=$(aws ecs describe-tasks \
            --cluster ${{ env.ECS_CLUSTER }} \
            --tasks "$TASK_ARN" \
            --query 'tasks[0].lastStatus' \
            --output text)
          echo "Status: $STATUS"
          [ "$STATUS" = "RUNNING" ] || (echo "Task not RUNNING after deploy" && exit 1)

# ── Job 4: Notify on failure ───────────────────────────────────────────────
  notify-failure:
    name: Notify on failure
    runs-on: ubuntu-latest
    needs: [test, build, deploy]
    if: failure() && github.ref == 'refs/heads/main'

    steps:
      - name: Post failure to Slack
        if: ${{ secrets.SLACK_WEBHOOK_URL != '' }}
        uses: slackapi/slack-github-action@v1
        with:
          payload: |
            {
              "text": ":x: *Q Cart deploy failed* on `${{ github.ref_name }}`\nCommit: ${{ github.sha }}\nTriggered by: ${{ github.actor }}\n<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View run>"
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK
