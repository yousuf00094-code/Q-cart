name: Flutter Web — Build & Deploy to GitHub Pages

on:
  push:
    branches: [main, claude/repo-file-inventory-we4dk9]
    paths:
      - 'lib/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - 'web/**'
      - '.github/workflows/flutter-web.yml'
  workflow_dispatch:
    inputs:
      api_base_url:
        description: 'Backend API base URL'
        required: false
        default: 'https://qcart-api.onrender.com/v1'

concurrency:
  group: flutter-web-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    name: Build Flutter Web
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.x'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build web
        run: |
          API_URL="${{ github.event.inputs.api_base_url || 'https://qcart-api.onrender.com/v1' }}"
          flutter build web --release \
            --dart-define=API_BASE_URL="$API_URL" \
            --base-href="/Q-cart/"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
