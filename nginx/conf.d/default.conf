upstream qcart_api {
    server api:3000;
    keepalive 32;
}

# HTTP — redirect to HTTPS (comment out for local dev without certs)
server {
    listen 80;
    server_name _;

    # Allow health probes through without redirect
    location /v1/health {
        proxy_pass         http://qcart_api;
        proxy_http_version 1.1;
        proxy_set_header   Connection "";
        access_log         off;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS
server {
    listen 443 ssl;
    http2  on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Security headers
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options    nosniff                                         always;
    add_header X-Frame-Options           DENY                                            always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin"               always;

    client_max_body_size 4m;

    # Health check — no rate limit, no access log
    location = /v1/health {
        proxy_pass         http://qcart_api;
        proxy_http_version 1.1;
        proxy_set_header   Connection "";
        access_log         off;
    }

    # Auth endpoints — tight rate limit
    location ~ ^/v1/auth/(login|register|refresh) {
        limit_req  zone=auth burst=3 nodelay;
        limit_conn perip 10;

        proxy_pass             http://qcart_api;
        proxy_http_version     1.1;
        proxy_set_header       Host              $host;
        proxy_set_header       X-Real-IP         $remote_addr;
        proxy_set_header       X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header       X-Forwarded-Proto $scheme;
        proxy_set_header       Connection        "";
        proxy_connect_timeout  5s;
        proxy_send_timeout     30s;
        proxy_read_timeout     30s;
    }

    # All other API traffic
    location /v1/ {
        limit_req  zone=api burst=50 nodelay;
        limit_conn perip 20;

        proxy_pass             http://qcart_api;
        proxy_http_version     1.1;
        proxy_set_header       Host              $host;
        proxy_set_header       X-Real-IP         $remote_addr;
        proxy_set_header       X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header       X-Forwarded-Proto $scheme;
        proxy_set_header       Connection        "";
        proxy_connect_timeout  5s;
        proxy_send_timeout     60s;
        proxy_read_timeout     60s;
        proxy_buffering        on;
        proxy_buffer_size      8k;
        proxy_buffers          8 8k;
    }
}
