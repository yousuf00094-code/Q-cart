services:
  - type: web
    name: qcart-api
    runtime: docker
    dockerfilePath: ./backend/nodejs/Dockerfile
    dockerContext: ./backend/nodejs
    plan: free
    healthCheckPath: /v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: SEED_DEMO_DATA
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: qcart-db
          property: connectionString
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_ACCESS_EXPIRY
        value: 15m
      - key: JWT_REFRESH_EXPIRY
        value: 7d
      - key: BCRYPT_ROUNDS
        value: "12"
      - key: DB_POOL_MIN
        value: "1"
      - key: DB_POOL_MAX
        value: "5"
      - key: CORS_ORIGINS
        value: "*"
      - key: RATE_LIMIT_MAX
        value: "300"
      - key: AUTH_RATE_LIMIT_MAX
        value: "20"
      - key: BASE_URL
        value: https://qcart-api.onrender.com
      - key: LOYALTY_POINTS_PER_QAR
        value: "1"
      - key: LOYALTY_REDEEM_RATE
        value: "0.01"
      - key: DEFAULT_PAGE_LIMIT
        value: "24"
      - key: MAX_PAGE_LIMIT
        value: "100"

databases:
  - name: qcart-db
    plan: free
    databaseName: qcart
    user: qcart
